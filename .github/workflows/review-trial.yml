name: Logical single-item review
on: workflow_dispatch
permissions: {}
jobs:
  review:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheovanKraay/cosmos-agent-branching
          ref: 6970a5baa2d6df3fe90588fc0b48e8248263234f
          token: ${{ secrets.LIBRARY_READ_TOKEN }}
          persist-credentials: false
      - name: Verify review and dispose of the dedicated fixture
        env:
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash tools/review-trial.sh
