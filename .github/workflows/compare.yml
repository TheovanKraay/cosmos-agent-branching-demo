name: Compare three isolated emulators
on:
  workflow_dispatch:
    inputs:
      records:
        description: Starting orders per worker (try 10000 first)
        type: choice
        options: ['10000', '100000']
        default: '10000'
        required: true
permissions:
  contents: read
concurrency:
  group: hosted-cosmos-benchmark
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SWARM_RECORDS: ${{ inputs.records }}
      CARGO_BUILD_JOBS: '2'
      IMAGE: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheovanKraay/cosmos-agent-swarm
          ref: a76401fe420e7a0d54963dd18fe022054c26e43a
          token: ${{ secrets.LIBRARY_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare hosted Linux runner
        run: |
          # Map the context name expected by the pinned library to this VM's local daemon.
          docker context create desktop-linux --docker host=unix:///var/run/docker.sock
          docker --context desktop-linux info --format 'Docker {{.OSType}}: {{.NCPU}} CPUs, {{.MemTotal}} bytes RAM'
          df -h /var/lib/docker
          docker --context desktop-linux pull "$IMAGE"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install azure-cosmos==4.17.1
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build comparison
        run: |
          cargo +stable build --locked --release --manifest-path backends/filesystem/Cargo.toml --example swarm_compare >"$RUNNER_TEMP/build.log" 2>&1 || { echo "::error::Pinned benchmark build failed (private compiler output withheld)"; exit 1; }
      - name: Compare both approaches on this VM
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          echo "### Three workers, $SWARM_RECORDS orders per worker" >> "$GITHUB_STEP_SUMMARY"
          rows="$RUNNER_TEMP/verified-runs.jsonl"
          : > "$rows"
          for arm in fresh overlay overlay fresh; do
            samples="$RUNNER_TEMP/capacity.tsv"
            (while :; do
              echo "$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo) $(df -Pm /var/lib/docker | awk 'END {print $4}')"
              sleep 1
            done) > "$samples" &
            monitor=$!
            trap 'kill "$monitor" 2>/dev/null || :' EXIT
            rc=0
            backends/filesystem/target/release/examples/swarm_compare "$arm" >"$RUNNER_TEMP/result.json" 2>"$RUNNER_TEMP/worker.log" || rc=$?
            kill "$monitor"
            wait "$monitor" || :
            trap - EXIT
            read -r ram disk < <(awk 'NR==1 || $1<m {m=$1} NR==1 || $2<d {d=$2} END {print m,d}' "$samples")
            if ((rc)); then
              echo "::error::$arm failed (exit $rc; sampled minimum available RAM $ram MiB, disk $disk MiB). No successful timing reported."
              exit 1
            fi
            python -I -c '
          import json, sys
          arm, n, ram, disk, path = sys.argv[1:]
          with open(path) as f: r = json.load(f)
          if (r["mode"], r["fixture_records"], r["workers"], r["workload_ops"]) != (arm, int(n), 3, 600):
              sys.exit("Unexpected benchmark result")
          print(json.dumps([arm, r["seed_records"], r["ready_s"], r["verified_s"], r["all_in_s"], r["sdk_ops_per_s"], int(ram), int(disk)]))
          ' "$arm" "$SWARM_RECORDS" "$ram" "$disk" "$RUNNER_TEMP/result.json" >> "$rows"
          done
          python -I - "$rows" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          from statistics import mean
          with open(sys.argv[1]) as f:
              rows = [json.loads(line) for line in f]
          if [r[0] for r in rows] != ["fresh", "overlay", "overlay", "fresh"]:
              sys.exit("Incomplete comparison")
          print("| Average of two runs per approach | Fresh emulators | Native branches |")
          print("|---|---:|---:|")
          for i, (label, fmt, unit) in enumerate([
              ("Records seeded", ",.0f", ""),
              ("All three workers ready", ".2f", " s"),
              ("All three tasks verified", ".2f", " s"),
              ("Finished, including cleanup", ".2f", " s"),
              ("SDK operations/sec once ready", ",.0f", ""),
          ], start=1):
              cells = [format(mean(r[i] for r in rows if r[0] == arm), fmt) + unit
                       for arm in ("fresh", "overlay")]
              print("|", label, "|", " | ".join(cells), "|")
          print("\nTimes are cumulative from a cold start (lower is better). SDK throughput excludes setup (higher is better).")
          print("\n<details><summary>Individual runs and runner headroom</summary>\n")
          print("|Mode|Seed writes|Ready s|Verified s|Cleanup finished s|SDK ops/s|Min available RAM MiB|Min free disk MiB|")
          print("|---|---:|---:|---:|---:|---:|---:|---:|")
          for arm, seed, ready, verified, cleanup, rate, ram, disk in rows:
              print(f"|{arm}|{seed}|{ready:.1f}|{verified:.1f}|{cleanup:.1f}|{rate:.1f}|{ram}|{disk}|")
          print("\n</details>")
          PY
