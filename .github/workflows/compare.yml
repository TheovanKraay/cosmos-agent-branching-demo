name: Compare three isolated emulators
on:
  workflow_dispatch:
    inputs:
      records:
        description: Starting orders per worker (try 10000 first)
        type: choice
        options: ['10000', '100000']
        default: '10000'
        required: true
      profile:
        description: Investigate throughput with restart controls and longer read/write timings
        type: boolean
        default: false
      wal:
        description: Measure PostgreSQL WAL I/O for ordinary versus layered stopped forks
        type: boolean
        default: false
      patterns:
        description: Compare hot and spread replacements with allocation and wait sampling
        type: boolean
        default: false
      layouts:
        description: Compare storage layouts (overrides other diagnostic modes)
        type: choice
        options: ['none', 'native', 'xfs', 'xfs-proof', 'cold', 'faults', 'heavy', 'heavy-reverse', 'scale', 'scale-ext4', 'related']
        default: 'none'
permissions:
  contents: read
concurrency:
  group: hosted-cosmos-benchmark
  cancel-in-progress: false
jobs:
  compare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SWARM_RECORDS: ${{ inputs.records }}
      CARGO_BUILD_JOBS: '2'
      IMAGE: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheovanKraay/cosmos-agent-swarm
          ref: 6e6cfe14b409c9c69cab6856be8efb92fa6e3086
          token: ${{ secrets.LIBRARY_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare hosted Linux runner
        run: |
          # Map the context name expected by the pinned library to this VM's local daemon.
          docker context create desktop-linux --docker host=unix:///var/run/docker.sock
          docker --context desktop-linux info --format 'Docker {{.OSType}}: {{.NCPU}} CPUs, {{.MemTotal}} bytes RAM'
          df -h /var/lib/docker
          docker --context desktop-linux pull "$IMAGE"
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install azure-cosmos==4.17.1
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
      - name: Build comparison
        if: ${{ inputs.layouts == 'cold' || startsWith(inputs.layouts,'heavy') || startsWith(inputs.layouts,'scale') || (!inputs.wal && !inputs.patterns && inputs.layouts == 'none') }}
        run: |
          cargo +stable build --locked --release --manifest-path backends/filesystem/Cargo.toml --example swarm_compare >"$RUNNER_TEMP/build.log" 2>&1 || { echo "::error::Pinned benchmark build failed (private compiler output withheld)"; exit 1; }
      - name: Compare both approaches on this VM
        if: ${{ !inputs.profile && !inputs.wal && !inputs.patterns && inputs.layouts == 'none' }}
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          echo "### Three workers, $SWARM_RECORDS orders per worker" >> "$GITHUB_STEP_SUMMARY"
          rows="$RUNNER_TEMP/verified-runs.jsonl"
          : > "$rows"
          for arm in fresh overlay overlay fresh; do
            samples="$RUNNER_TEMP/capacity.tsv"
            (while :; do
              echo "$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo) $(df -Pm /var/lib/docker | awk 'END {print $4}')"
              sleep 1
            done) > "$samples" &
            monitor=$!
            trap 'kill "$monitor" 2>/dev/null || :' EXIT
            rc=0
            backends/filesystem/target/release/examples/swarm_compare "$arm" >"$RUNNER_TEMP/result.json" 2>"$RUNNER_TEMP/worker.log" || rc=$?
            kill "$monitor"
            wait "$monitor" || :
            trap - EXIT
            read -r ram disk < <(awk 'NR==1 || $1<m {m=$1} NR==1 || $2<d {d=$2} END {print m,d}' "$samples")
            if ((rc)); then
              echo "::error::$arm failed (exit $rc; sampled minimum available RAM $ram MiB, disk $disk MiB). No successful timing reported."
              exit 1
            fi
            python -I -c '
          import json, sys
          arm, n, ram, disk, path = sys.argv[1:]
          with open(path) as f: r = json.load(f)
          if (r["mode"], r["fixture_records"], r["workers"], r["workload_ops"]) != (arm, int(n), 3, 600):
              sys.exit("Unexpected benchmark result")
          print(json.dumps([arm, r["seed_records"], r["ready_s"], r["verified_s"], r["all_in_s"], r["sdk_ops_per_s"], int(ram), int(disk)]))
          ' "$arm" "$SWARM_RECORDS" "$ram" "$disk" "$RUNNER_TEMP/result.json" >> "$rows"
          done
          python -I - "$rows" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          from statistics import mean
          with open(sys.argv[1]) as f:
              rows = [json.loads(line) for line in f]
          if [r[0] for r in rows] != ["fresh", "overlay", "overlay", "fresh"]:
              sys.exit("Incomplete comparison")
          print("| Average of two runs per approach | Fresh emulators | Native branches |")
          print("|---|---:|---:|")
          for i, (label, fmt, unit) in enumerate([
              ("Records seeded", ",.0f", ""),
              ("All three workers ready", ".2f", " s"),
              ("All three tasks verified", ".2f", " s"),
              ("Finished, including cleanup", ".2f", " s"),
              ("SDK operations/sec once ready", ",.0f", ""),
          ], start=1):
              cells = [format(mean(r[i] for r in rows if r[0] == arm), fmt) + unit
                       for arm in ("fresh", "overlay")]
              print("|", label, "|", " | ".join(cells), "|")
          print("\nTimes are cumulative from a cold start (lower is better). SDK throughput excludes setup (higher is better).")
          print("\n<details><summary>Individual runs and runner headroom</summary>\n")
          print("|Mode|Seed writes|Ready s|Verified s|Cleanup finished s|SDK ops/s|Min available RAM MiB|Min free disk MiB|")
          print("|---|---:|---:|---:|---:|---:|---:|---:|")
          for arm, seed, ready, verified, cleanup, rate, ram, disk in rows:
              print(f"|{arm}|{seed}|{ready:.1f}|{verified:.1f}|{cleanup:.1f}|{rate:.1f}|{ram}|{disk}|")
          print("\n</details>")
          PY
      - name: Compare first burst and longer mixed workloads
        if: inputs.profile && !inputs.wal && !inputs.patterns && inputs.layouts == 'none'
        env:
          SWARM_DIAGNOSTIC: '1'
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          echo '|Mode|First 600 ops/s|Next 12k ops/s|Repeat 12k ops/s|Read ms (next/repeat)|Write ms (next/repeat)|' >> "$GITHUB_STEP_SUMMARY"
          echo '|---|---:|---:|---:|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
          for arm in fresh restart overlay overlay restart fresh; do
            backends/filesystem/target/release/examples/swarm_compare "$arm" >"$RUNNER_TEMP/result.json" 2>"$RUNNER_TEMP/worker.log"
            python -I -c '
          import json,sys
          with open(sys.argv[1]) as f: r=json.load(f)
          a,b=r["profile"]
          assert r["mode"]==sys.argv[2]
          print("|{}|{:.1f}|{:.1f}|{:.1f}|{:.3f}/{:.3f}|{:.3f}/{:.3f}|".format(r["mode"], r["sdk_ops_per_s"], a["ops_s"], b["ops_s"], a["read_ms"], b["read_ms"], a["write_ms"], b["write_ms"]))
          ' "$RUNNER_TEMP/result.json" "$arm" | tee -a "$GITHUB_STEP_SUMMARY"
          done
      - name: Prepare disposable XFS scratch
        if: contains(fromJSON('["xfs","xfs-proof","cold","faults","heavy","heavy-reverse","scale","scale-ext4","related"]'), inputs.layouts)
        env:
          LAYOUT: ${{ inputs.layouts }}
        run: |
          command -v mkfs.xfs || { sudo apt-get update -qq && sudo apt-get install -y xfsprogs; }
          img=$(mktemp "$RUNNER_TEMP/layout-XXXXXX.img")
          root=$(mktemp -d "$RUNNER_TEMP/layout-XXXXXX")
          truncate -s 8G "$img"
          if [[ $LAYOUT == scale-ext4 ]]; then mkfs.ext4 -F "$img"; else mkfs.xfs -m reflink=1 "$img"; fi
          sudo mount -o loop "$img" "$root"
          sudo chown "$USER" "$root"
          echo "LAYOUT_XFS=$root" >> "$GITHUB_ENV"
          echo "One-time scratch filesystem preparation: ${SECONDS}s" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Compare verified cold sessions on XFS
        if: inputs.layouts == 'cold' || startsWith(inputs.layouts,'heavy') || startsWith(inputs.layouts,'scale')
        shell: bash
        env:
          SWARM_CI_XFS: '1'
          TRIAL: ${{ inputs.layouts }}
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          arms=(fresh overlay reflink reflink overlay fresh)
          if [[ "$TRIAL" == scale* ]]; then
            arms=(fresh:3 auto:3 auto:4 fresh:4); if [[ "$TRIAL" == scale-ext4 ]]; then arms=(auto:4); fi
            echo '| Workers | Mode | Selected backend | Verified s | Ready s | Mixed ops/s | Peak growth MiB |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---:|---|---|---:|---:|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$TRIAL" == heavy* ]]; then
            export SWARM_HEAVY=1
            [[ $SWARM_RECORDS == 100000 ]] || { echo "::error::Heavy trials require 100000 orders"; exit 1; }
            arms=(overlay reflink); if [[ $TRIAL == heavy-reverse ]]; then arms=(reflink overlay); fi
            echo '| Mode | Verified s | Ready s | First writes/s | Repeat writes/s | First p95 ms | Repeat p95 ms | Peak growth MiB |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---:|---:|---:|---:|---:|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '| Mode | Verified s | Ready s | Warm replace ms | Sampled peak data growth MiB |' >> "$GITHUB_STEP_SUMMARY"
            echo '|---|---:|---:|---:|---:|' >> "$GITHUB_STEP_SUMMARY"
          fi
          for arm in "${arms[@]}"; do
            if [[ "$TRIAL" == scale* ]]; then export SWARM_WORKERS="${arm#*:}"; arm="${arm%:*}"; fi
            used() { df -B1 --output=used "$LAYOUT_XFS" | tail -1; }
            before=$(used)
            (while :; do used; sleep 1; done) > "$RUNNER_TEMP/used" &
            sampler=$!
            trap 'kill "$sampler" 2>/dev/null || :' EXIT
            backends/filesystem/target/release/examples/swarm_compare "$arm" > "$RUNNER_TEMP/arm" 2>"$RUNNER_TEMP/worker.log" || {
              echo "::error::$arm failed; private logs withheld"
              grep -oE 'line [0-9]+, in [a-zA-Z_]+|^[A-Za-z]+Error:' "$RUNNER_TEMP/worker.log" | tail -8
              exit 1
            }
            kill "$sampler"; wait "$sampler" || :
            trap - EXIT
            python -I - "$RUNNER_TEMP" "$arm" "$before" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json,pathlib,sys
          folder=pathlib.Path(sys.argv[1])
          r=json.loads((folder/'arm').read_text())
          assert r['mode']==sys.argv[2]
          growth=(max(map(int,(folder/'used').read_text().split()))-int(sys.argv[3]))/2**20
          import os
          if os.environ['TRIAL'].startswith('scale'):
              n=int(os.environ['SWARM_WORKERS'])
              assert r['workers']==n and r['workload_ops']==200*n
              expected='none' if r['mode']=='fresh' else 'overlay' if os.environ['TRIAL']=='scale-ext4' else 'reflink'
              assert r['backend']==expected
              print(f"| {n} | {r['mode']} | {expected} | {r['verified_s']:.2f} | {r['ready_s']:.2f} | {r['sdk_ops_per_s']:.1f} | {growth:.1f} |")
          elif os.environ['TRIAL'].startswith('heavy'):
              a,b=r['first'],r['repeat']
              assert a['writes']==b['writes']==75000
              print(f"| {r['mode']} | {r['verified_s']:.2f} | {r['ready_s']:.2f} | {a['ops_s']:.1f} | {b['ops_s']:.1f} | {a['p95_ms']:.3f} | {b['p95_ms']:.3f} | {growth:.1f} |")
          else:
              assert r['workers']==3 and len(r['profile'])==2
              print(f"| {r['mode']} | {r['verified_s']:.2f} | {r['ready_s']:.2f} | {sum(w['write_ms'] for w in r['profile'])/2:.3f} | {growth:.1f} |")
          PY
          done
      - name: Five related code and data tasks
        if: inputs.layouts == 'related'
        shell: bash
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          python -I -B backends/filesystem/overlay/related_tasks.py copy auto auto copy >"$RUNNER_TEMP/tasks.jsonl" 2>"$RUNNER_TEMP/tasks.log" || {
            grep -oE 'line [0-9]+, in [a-zA-Z_]+|^[A-Za-z]+Error:' "$RUNNER_TEMP/tasks.log" | tail -8; exit 1;
          }
          python -I - "$RUNNER_TEMP/tasks.jsonl" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json,sys
          rows=[json.loads(l) for l in open(sys.argv[1])]
          assert [r['backend'] for r in rows]==['copy','reflink','reflink','copy']
          print('| Backend | All 5 verified s | Seed s | Five forks MiB | Retained data MiB | Overlap s (2 / 3 workers) |')
          print('|---|---:|---:|---:|---:|---:|')
          for r in rows:
              assert r['tasks']==5 and len(r['overlap_s'])==2 and min(r['overlap_s'])>0
              print('| {backend} | {verified_s} | {seed_s} | {fork_mib} | {retained_mib} | {overlap_s} |'.format(**r))
          PY
      - name: Profile storage I/O
        if: ${{ inputs.layouts != 'related' && !startsWith(inputs.layouts,'scale') && !startsWith(inputs.layouts,'heavy') && inputs.layouts != 'cold' && inputs.layouts != 'faults' && (inputs.wal || inputs.patterns || inputs.layouts != 'none') }}
        env:
          PATTERNS: ${{ inputs.patterns }}
          LAYOUTS: ${{ inputs.layouts }}
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          args=()
          if [[ $PATTERNS == true ]]; then args+=(--patterns); fi
          if [[ $LAYOUTS != none ]]; then args=(--layouts); fi
          if [[ $LAYOUTS == xfs ]]; then args+=(--reflink); fi
          if [[ $LAYOUTS == xfs-proof ]]; then args=(--reflink --proof); fi
          rows="$RUNNER_TEMP/storage.jsonl"
          python -I -B backends/filesystem/overlay/wal_probe.py "${args[@]}" >"$rows" 2>"$RUNNER_TEMP/wal-probe.log" || { echo "::error::Storage probe failed after $(wc -l < "$rows") arms (private stderr withheld)"; grep -oE 'line [0-9]+, in [a-zA-Z_]+' "$RUNNER_TEMP/wal-probe.log" | tail -4; exit 1; }
          expected=4; if [[ $PATTERNS == true ]]; then expected=8; fi
          if [[ $LAYOUTS == native ]]; then expected=8; elif [[ $LAYOUTS == xfs ]]; then expected=10; fi
          if [[ $LAYOUTS == xfs-proof ]]; then expected=1; fi
          [[ $(wc -l < "$rows") == "$expected" ]] || { echo "::error::Incomplete storage probe"; exit 1; }
          cat "$rows"
          if [[ $LAYOUTS == xfs-proof ]]; then
            python -I -c 'import json,sys; r=json.load(open(sys.argv[1])); assert r["recursive_readback"] and r["reset"] and 0 < r["reflink_physical_bytes"] < r["copy_physical_bytes"]; print("Verified recursive isolation and reset. Fork allocation: full copy %.2f MiB; reflink %.2f MiB." % (r["copy_physical_bytes"]/2**20,r["reflink_physical_bytes"]/2**20))' "$rows" >> "$GITHUB_STEP_SUMMARY"
          elif [[ $LAYOUTS != none ]]; then
            python -I - "$rows" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, os, sys
          from statistics import mean
          arms = [json.loads(line) for line in open(sys.argv[1])]
          modes = ['copy','overlay','full-upper','plain-overlay'] + (['reflink'] if os.environ['LAYOUTS']=='xfs' else [])
          assert [a['mode'] for a in arms] == modes + modes[::-1]
          print('| Layout | First ms/write | Repeat ms/write | Repeat ops/s | Verified fork of 3 (s) |')
          print('|---|---:|---:|---:|---:|')
          for mode in modes:
              pair = [a for a in arms if a['mode']==mode]
              assert all([r['window'] for r in a['rows']]==['first','repeat'] for a in pair)
              v = [mean(a['rows'][i][k] for a in pair) for i,k in [(0,'mean_ms'),(1,'mean_ms'),(1,'ops_s')]]
              v.append(mean(a['fork_seconds'] for a in pair))
              print(f'| {mode} | ' + ' | '.join(f'{x:.2f}' for x in v) + ' |')
          PY
          elif [[ $PATTERNS == true ]]; then
            python -I - "$rows" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, sys
          from collections import defaultdict
          from statistics import mean
          groups = defaultdict(list)
          for line in open(sys.argv[1]):
              arm = json.loads(line)
              for r in arm['rows']:
                  groups[arm['pattern'], r['window'], arm['mode']].append(r)
          print('| Keys | Window | Copy ms/write | Overlay ms/write | Copy growth MiB | Overlay growth MiB |')
          print('|---|---|---:|---:|---:|---:|')
          for p in ('hot','spread'):
              for w in ('first','repeat'):
                  c,o = (groups[p,w,m] for m in ('copy','overlay'))
                  assert len(c) == len(o) == 2
                  values = [mean(r[k] for r in g)/d for k,d in [('mean_ms',1),('growth',2**20)] for g in (c,o)]
                  print(f'| {p} | {w} | ' + ' | '.join(f'{v:.2f}' for v in values) + ' |')
          PY
          else
            cat "$rows" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Verify rejected partial forks
        if: inputs.layouts == 'faults'
        shell: bash
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          log="$RUNNER_TEMP/faults.log"
          python -I -B backends/filesystem/overlay/fork_faults.py 2>"$log" | tee -a "$GITHUB_STEP_SUMMARY" || { grep -oE 'line [0-9]+, in [a-zA-Z_]+' "$log" | tail -8; exit 1; }
