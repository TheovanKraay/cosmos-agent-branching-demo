name: Paired pricing agents on the development fork
on: workflow_dispatch
permissions:
  copilot-requests: write
jobs:
  trial:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheovanKraay/cosmos-agent-branching
          ref: 475aafb098eb8ccc5e1676f1f1cc41ec7877aa49
          token: ${{ secrets.LIBRARY_READ_TOKEN }}
          persist-credentials: false
      - name: Prepare isolated tool and agent processes
        run: |
          docker context create desktop-linux --docker host=unix:///var/run/docker.sock
          docker pull mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator@sha256:db53613dae19d0a3d5ad50688d14aa6e957af082dafea56b52e1bd3a6b3f1406
          python -m venv "$RUNNER_TEMP/sdk"
          "$RUNNER_TEMP/sdk/bin/pip" install azure-cosmos==4.17.1 mcp==1.26.0
          docker build -t pricing-agent:trial - <<'EOF'
          FROM node:22-bookworm-slim
          RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates git socat && npm install -g @github/copilot@1.0.115
          USER node
          WORKDIR /home/node
          ENTRYPOINT ["copilot"]
          EOF
      - name: Verify concurrent workers and inherited follow-up
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          M2_SDK_KEY=$(python -c 'import pathlib,re; print(re.search(r"const EMULATOR_KEY: &str =\s*\"([^\"]+)\"", pathlib.Path("src/local.rs").read_text())[1])')
          echo "::add-mask::$M2_SDK_KEY"
          export M2_SDK_KEY
          if ! "$RUNNER_TEMP/sdk/bin/python" -I -B backends/filesystem/overlay/agent_trial.py >"$RUNNER_TEMP/trial.out" 2>"$RUNNER_TEMP/trial.err"; then
            grep -oE '^([A-Za-z]+Error|[A-Za-z]+Exception):|line [0-9]+, in [a-zA-Z_]+' "$RUNNER_TEMP/trial.err" | tail -10
            echo "::error::Trial did not complete. Private source, agent messages and SDK logs withheld."
            exit 1
          fi
          grep -Fx 'Verified three agent tool sessions: base 100, discount 90, delivery 105, coupon 83; inherited code, Git ancestry, sealed ancestors and cleanup passed.' "$RUNNER_TEMP/trial.out" >> "$GITHUB_STEP_SUMMARY"
