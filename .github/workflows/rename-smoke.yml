name: Rust package rename smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheovanKraay/cosmos-agent-swarm
          ref: a76401fe420e7a0d54963dd18fe022054c26e43a
          token: ${{ secrets.LIBRARY_READ_TOKEN }}
          persist-credentials: false
      - name: Test the renamed package and public Rust import
        run: cargo +stable test --locked -p cosmos-agent-branching --test local
