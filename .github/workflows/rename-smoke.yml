name: Rust package rename smoke test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  smoke:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: TheovanKraay/cosmos-agent-branching
          ref: b4c26912761f584ebda977f6e02bc91c9720b858
          token: ${{ secrets.LIBRARY_READ_TOKEN }}
          persist-credentials: false
      - name: Test the renamed package and public Rust import
        run: |
          cargo +stable test --locked -p cosmos-agent-branching --test local >"$RUNNER_TEMP/smoke.log" 2>&1 || { echo "::error::Rename smoke test failed (private compiler output withheld)"; exit 1; }
          echo 'Renamed Cargo package and Rust import passed.' >> "$GITHUB_STEP_SUMMARY"
